<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELODY.BEST - Your Personal Homepage</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Logo/Title -->
        <div class="logo">
            <h1>MELODY.BEST</h1>
        </div>

        <!-- Greeting -->
        <div class="greeting" id="greeting">Hello!</div>

        <!-- Clock and Date -->
        <div class="datetime-container">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">Monday, January 1, 2024</div>
        </div>

        <!-- Search Container -->
        <div class="search-container">
            <div class="search-provider-display" id="providerDisplay">
                <img src="" alt="" id="providerIcon" class="provider-icon">
                <span id="providerName">Google</span>
            </div>
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search the web..."
                    autocomplete="off"
                >
                <button type="submit" class="search-button" id="searchButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Settings Button -->
        <button class="settings-trigger" id="settingsButton" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243m-6.364 0L3.636 17.364m12.728 0l-4.243-4.243m-6.364 0L3.636 6.636"></path>
            </svg>
        </button>
    </div>

    <!-- Settings Panel -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-button" id="closeSettings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="settings-content">
                <!-- Search Provider Section -->
                <div class="settings-section">
                    <h3>Search Provider</h3>
                    <div class="search-providers">
                        <button class="provider-button" data-provider="google">
                            <span class="provider-emoji">🔍</span>
                            <span>Google</span>
                        </button>
                        <button class="provider-button" data-provider="bing">
                            <span class="provider-emoji">🅱️</span>
                            <span>Bing</span>
                        </button>
                        <button class="provider-button" data-provider="duckduckgo">
                            <span class="provider-emoji">🦆</span>
                            <span>DuckDuckGo</span>
                        </button>
                        <button class="provider-button" data-provider="yahoo">
                            <span class="provider-emoji">🟣</span>
                            <span>Yahoo</span>
                        </button>
                        <button class="provider-button" data-provider="brave">
                            <span class="provider-emoji">🦁</span>
                            <span>Brave Search</span>
                        </button>
                        <button class="provider-button" data-provider="ecosia">
                            <span class="provider-emoji">🌱</span>
                            <span>Ecosia</span>
                        </button>
                    </div>
                </div>

                <!-- Homepage Settings Section -->
                <div class="settings-section">
                    <h3>Homepage Settings</h3>
                    <div class="setting-item">
                        <label for="greetingInput">Custom Greeting</label>
                        <input 
                            type="text" 
                            id="greetingInput" 
                            placeholder="Enter your name..."
                            class="text-input"
                        >
                    </div>
                    <div class="setting-item">
                        <label class="toggle-label">
                            <input type="checkbox" id="showClock" class="toggle-checkbox">
                            <span class="toggle-switch"></span>
                            <span>Show Clock</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label class="toggle-label">
                            <input type="checkbox" id="showDate" class="toggle-checkbox">
                            <span class="toggle-switch"></span>
                            <span>Show Date</span>
                        </label>
                    </div>
                </div>

                <!-- Appearance Settings Section -->
                <div class="settings-section">
                    <h3>Appearance</h3>
                    <div class="setting-item">
                        <label class="toggle-label">
                            <input type="checkbox" id="darkMode" class="toggle-checkbox">
                            <span class="toggle-switch"></span>
                            <span>Dark Mode</span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label>Accent Color</label>
                        <div class="color-swatches">
                            <button class="color-swatch" data-color="#6C63FF" style="background-color: #6C63FF;" aria-label="Blue"></button>
                            <button class="color-swatch" data-color="#9B59B6" style="background-color: #9B59B6;" aria-label="Purple"></button>
                            <button class="color-swatch" data-color="#E74C3C" style="background-color: #E74C3C;" aria-label="Red"></button>
                            <button class="color-swatch" data-color="#2ECC71" style="background-color: #2ECC71;" aria-label="Green"></button>
                            <button class="color-swatch" data-color="#F39C12" style="background-color: #F39C12;" aria-label="Orange"></button>
                            <button class="color-swatch" data-color="#E91E63" style="background-color: #E91E63;" aria-label="Pink"></button>
                        </div>
                        <div class="custom-color-picker">
                            <label for="customColor">Custom Color:</label>
                            <input type="color" id="customColor" class="color-input">
                        </div>
                    </div>
                </div>

                <!-- Reset Button -->
                <div class="settings-section">
                    <button class="reset-button" id="resetButton">Reset to Defaults</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
